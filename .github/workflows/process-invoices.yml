name: Procesar facturas

# El ciclo automático lo lanza el cron del cPanel de facturas.salvest.es (bin/worker.php cada
# 3 horas). Este workflow queda solo para lanzar un ciclo a mano desde GitHub si hiciera falta.
on:
  workflow_dispatch:

concurrency:
  group: salvest-invoice-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ejecutar un ciclo remoto
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          test -n "$CRON_TOKEN"
          curl --fail --silent --show-error --max-time 240 \
            --get --data-urlencode "token=$CRON_TOKEN" \
            https://facturas.salvest.es/cron.php
